plugins {
	id 'base'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

allprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		maven {
			name = 'TerraformersMC'
			url = 'https://maven.terraformersmc.com/releases/'
		}
		maven {
			name = 'isXander'
			url = 'https://maven.isxander.dev/releases/'
		}
		mavenCentral()
	}
}

tasks.register('universalJar', Jar) {
	group = 'build'
	description = 'Builds a single jar containing Fabric and NeoForge loader metadata/entrypoints.'
	dependsOn ':fabric:build', ':neoforge:jar'

	archiveBaseName = project.archives_base_name
	archiveVersion = project.mod_version
	archiveClassifier = ''
	destinationDirectory = layout.buildDirectory.dir('libs')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from({
		def fabricJarTask = project(':fabric').tasks.findByName('remapJar') ?: project(':fabric').tasks.named('jar').get()
		zipTree(fabricJarTask.archiveFile.get().asFile)
	})
	from({ zipTree(project(':neoforge').tasks.named('jar').get().archiveFile.get().asFile) }) {
		include 'META-INF/neoforge.mods.toml'
		include 'io/github/samispoggers/neoforge/**'
	}
}

tasks.named('assemble') {
	dependsOn tasks.named('universalJar')
}

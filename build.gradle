plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.19-SNAPSHOT'
	id 'ploceus' version '1.19-SNAPSHOT'
}

base {
	archivesName = project.archives_base_name
}

version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

repositories {
	// Loom provides the repositories needed for Minecraft and its libraries.
	// Add additional repositories only when a dependency requires them.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Polyfrost'
		url = 'https://repo.polyfrost.org/releases'
	}
	maven {
		name = 'Hypixel'
		url = 'https://repo.hypixel.net/repository/Hypixel/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)

	ploceus.dependOsl(project.osl_version)

	modCompileOnly "maven.modrinth:modmenu-ornithe:${project.modmenu_version}"
	compileOnly("org.polyfrost.oneconfig:config:${project.oneconfig_api_version}") {
		transitive = false
	}
	compileOnly("org.polyfrost.oneconfig:config-impl:${project.oneconfig_api_version}") {
		transitive = false
	}
	runtimeOnly "net.hypixel:mod-api:1.0.2"
}

configurations.named('compileClasspath') {
	attributes {
		attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
	}
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 8
}

java {
	// The mod targets Java 8 bytecode for Minecraft 1.8.9.
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8

	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename {
			"${it}_${base.archivesName.get()}"
		}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Configure a Maven publishing destination here if needed.
	}
}
